name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Oldest supported runner, so the binary runs on distros with glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake zlib1g-dev libgl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVV_BUNDLE_GLFW=ON -DVV_STATIC_LIBSTDCXX=ON
          cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build OpenGL ES variant (the Android rendering path)
        run: |
          cmake -S . -B build-gles -DCMAKE_BUILD_TYPE=Release -DVV_BUNDLE_GLFW=ON -DVV_GLES=ON
          cmake --build build-gles -j --target voxel-viewer

      - name: Package
        run: |
          dir=voxel-viewer-linux-x86_64
          mkdir $dir
          cp build/voxel-viewer build/voxinfo README.md $dir/
          strip $dir/voxel-viewer $dir/voxinfo
          tar czf $dir.tar.gz $dir
          ldd $dir/voxel-viewer

      - uses: actions/upload-artifact@v4
        with:
          name: voxel-viewer-linux-x86_64
          path: voxel-viewer-linux-x86_64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk voxel-viewer-android.apk
          ls -la voxel-viewer-android.apk

      - name: Verify APK contents
        run: |
          set -e
          unzip -l voxel-viewer-android.apk | grep -E "lib/|assets/"
          nm=$(ls -d $ANDROID_HOME/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm | tail -1)
          # Every native method declared in Java must be exported by every ABI, or the app crashes on use.
          methods=$(grep -oE 'static native [^ ]+ [a-zA-Z]+' android/app/src/main/java/com/nuxdie/voxelviewer/NativeLib.java | awk '{print $4}')
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -p voxel-viewer-android.apk lib/$abi/libvoxelviewer.so > lib.so
            for m in $methods; do
              $nm -D --defined-only lib.so | grep -q "Java_com_nuxdie_voxelviewer_NativeLib_$m\$" || { echo "missing $m in $abi"; exit 1; }
            done
            echo "$abi: all $(echo $methods | wc -w) JNI methods exported"
          done
          unzip -l voxel-viewer-android.apk | grep -q assets/forest.schem

      - uses: actions/upload-artifact@v4
        with:
          name: voxel-viewer-android
          path: voxel-viewer-android.apk

  release:
    needs: [linux, android]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Every push to master refreshes the rolling "latest" release.
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release delete latest --yes || true
          gh release create latest dist/voxel-viewer-linux-x86_64.tar.gz dist/voxel-viewer-android.apk \
            --title "Latest build (master)" --prerelease \
            --notes "Automatic build of master at ${GITHUB_SHA}. Linux: download, extract and run ./voxel-viewer <file>. Android: install voxel-viewer-android.apk (allow installing from unknown sources)."

      # Pushing a tag like v1.0 creates a versioned release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/voxel-viewer-linux-x86_64.tar.gz dist/voxel-viewer-android.apk \
            --title "${GITHUB_REF_NAME}" --generate-notes
