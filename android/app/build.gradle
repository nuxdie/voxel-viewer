plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nuxdie.voxelviewer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nuxdie.voxelviewer'
        minSdk 24
        targetSdk 34
        // CI passes the run number so every build can be installed over the previous one.
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName project.findProperty('versionName') ?: '1.0-dev'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    signingConfigs {
        // A throwaway key committed to the repo so sideloaded updates keep the same signature.
        // It is public: do not use it for anything distributed through a store.
        sideload {
            storeFile rootProject.file('sideload.keystore')
            storePassword 'voxelviewer'
            keyAlias 'sideload'
            keyPassword 'voxelviewer'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
